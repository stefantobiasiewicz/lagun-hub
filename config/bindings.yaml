# Bindings: when this happens, do that.
#
# Both sides are keyed by Uid — through an alias the hub translates on load. The `type`
# field is mandatory and does what `expect` in KONFIGURACJA.md §10 promises: it lets a
# typo in `Toogle` be caught without access to the hardware.
#
# A write as the target carries the source's value, copied as it is, on every report
# (KONFIGURACJA.md §5, zadania/zrobione/FEAT-13.md) — below, the sensor's temperature and
# humidity on the display's fields 4 and 6.

bindings:
- from:
    node: test
    endpoint: 4
    type: KeyInput
    event: Click
  to:
    node: kitchen-relay
    endpoint: 4
    type: Output
    command: Toggle
- from:
    node: kitchen-switch
    endpoint: 4
    type: KeyInput
    event: Click
  to:
    node: kitchen-relay
    endpoint: 4
    type: Output
    command: Toggle
- from:
    node: kitchen-env
    endpoint: 4
    type: Sense
    attribute: Value
  to:
    node: kitchen-display
    endpoint: 4
    type: Display
    attribute: Value
- from:
    node: kitchen-env
    endpoint: 5
    type: Sense
    attribute: Value
  to:
    node: kitchen-display
    endpoint: 6
    type: Display
    attribute: Value
- from:
    node: kitchen-env
    endpoint: 4
    type: Sense
    attribute: Value
  to:
    node: kitchen-epd
    endpoint: 4
    type: Display
    attribute: Value
- from:
    node: kitchen-env
    endpoint: 5
    type: Sense
    attribute: Value
  to:
    node: kitchen-epd
    endpoint: 5
    type: Display
    attribute: Value
