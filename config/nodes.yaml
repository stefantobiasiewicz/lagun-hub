# Nodes — the key is the Uid, because that is what identity is.
#
# The alias is a label given by a person and is there only to make the file readable:
# bindings refer to it instead of to sixteen bytes. Were it the key, the file would look
# as if the hub knew "that is kitchen-relay" — while all it knows is that somebody
# named THIS Uid that way.
#
# Nothing is keyed by address: an address is a route, not an identity. The address a
# node got at joining is written here BY THE HUB, as one line in the node's entry —
#   joined: {address: 0x012, bus: ground-floor, short_id: 0x5A1B2C3D}
# — so that after a restart the hub talks to the node at once (KONFIGURACJA.md §4.3).

nodes:
  "0001020304050607":
    alias: kitchen-switch
    name: "The kitchen key"
    room: kitchen
    endpoints:
      4:
        type: KeyInput
        name: "Left key"
        # Only what this key declares: a key without MULTICLICK has no EventMode,
        # and a timing it does not expose it sets itself — the hub reports either
        # as an issue rather than sending it (01-model-danych.md §2.1).
        EventMode: CLICK
        HoldEnabled: true
        HoldThreshold: 550
  "08090a0b0c0d0e0f":
    alias: kitchen-relay
    name: "The lamp over the table"
    room: kitchen
    endpoints:
      4:
        type: Output
        name: "The lamp over the table"
        Purpose: LIGHT
        PowerOnBehaviour: "OFF"
        groups: [all-lights, living-room]
  a201020304050607:
    name: test
    alias: test
  "1011121314151617":
    alias: kitchen-display
    name: "The kitchen display"
    room: kitchen
    endpoints:
      # A display field shows what the hub writes (types/0x0022-display.md). Value and
      # Text are working values — `w` in the view or PUT …/attributes/Value — not
      # configuration; only how long content stays is a setting.
      4:
        type: Display
        name: "Temperature"
        ContentTimeout: 600     # s without a new value, then dashes; 0 = never
      5:
        type: Display
        name: "Message line"    # 16 bytes; keeps its own 120 s
      6:
        type: Display
        name: "Humidity or a short text"
