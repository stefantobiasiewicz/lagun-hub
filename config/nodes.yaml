# Nodes — the key is the Uid, because that is what identity is.
#
# The alias is a label given by a person and is there only to make the file readable:
# bindings refer to it instead of to sixteen bytes. Were it the key, the file would look
# as if the hub knew "that is kitchen-relay" — while all it knows is that somebody
# named THIS Uid that way.
#
# Nothing is keyed by address: an address is a route, not an identity. The address a
# node got at joining is written here BY THE HUB, as one line in the node's entry —
#   joined: {address: 0x012, bus: ground-floor, short_id: 0x5A1B2C3D}
# — so that after a restart the hub talks to the node at once (KONFIGURACJA.md §4.3).

nodes:
  "0001020304050607":
    alias: kitchen-switch
    name: "The kitchen key"
    room: kitchen
    endpoints:
      4:
        type: KeyInput
        name: "Left key"
        # Only what this key declares: a key without MULTICLICK has no EventMode,
        # and a timing it does not expose it sets itself — the hub reports either
        # as an issue rather than sending it (01-model-danych.md §2.1).
        EventMode: CLICK
        HoldEnabled: true
        HoldThreshold: 550
  "08090a0b0c0d0e0f":
    alias: kitchen-relay
    name: "The lamp over the table"
    room: kitchen
    endpoints:
      4:
        type: Output
        name: "The lamp over the table"
        Purpose: LIGHT
        PowerOnBehaviour: "OFF"
        groups: [all-lights, living-room]
  a201020304050607:
    name: test
    alias: test
  "1011121314151617":
    alias: kitchen-display
    name: "The kitchen display"
    room: kitchen
    endpoints:
      # A display field shows what the hub writes (types/0x0022-display.md). Value and
      # Text are working values — `w` in the view or PUT …/attributes/Value — not
      # configuration; only how long content stays is a setting.
      4:
        type: Display
        name: "Temperature"
        ContentTimeout: 600     # s without a new value, then dashes; 0 = never
      5:
        type: Display
        name: "Message line"    # 16 bytes; keeps its own 120 s
      6:
        type: Display
        name: "Humidity or a short text"
  "3031323334353637":
    alias: kitchen-epd
    name: "The kitchen e-paper"
    room: kitchen
    endpoints:
      # The e-paper of segment digits — `lagun-sim epd`, the board devices/apps/epd
      # (zadania/zrobione/DEVICE-04.md). Numbers only, −9.9…199.9 °C and 0.0…99.9 %; a
      # write reaches the glass at once; every 10th refresh flashes the whole glass.
      4:
        type: Display
        name: "Temperature"
        ContentTimeout: 600     # s without a new value, then dashes; 0 = never
      5:
        type: Display
        name: "Humidity"
        ContentTimeout: 600
  "2021222324252627":
    alias: kitchen-env
    name: "The kitchen sensor"
    room: kitchen
    endpoints:
      # A room sensor (types/0x0030-sense.md) — `lagun-sim env`, the board devices/apps/env.
      # It reports by itself; bindings.yaml writes both values onto kitchen-display and
      # onto kitchen-epd.
      # Thresholds are in the quantity's units, °C here (KONFIGURACJA.md §7.2).
      4:
        type: Sense
        name: "Temperature"
        ThresholdHigh: 26.5
      5:
        type: Sense
        name: "Humidity"
  "5051525354555657":
    alias: kitchen-dial
    name: "The kitchen knob"
    room: kitchen
    endpoints:
      # A knob (types/0x0011-value-input.md) — `lagun-sim dial`, the board devices/apps/dial:
      # the encoder's value on ep4, the key in its shaft on ep5, one channel.
      # bindings.yaml toggles kitchen-relay with the shaft's click, and dims kitchen-strip
      # with the value: `SetLevel(level: $value)` (zadania/zrobione/DEVICE-02.md B4).
      4:
        type: ValueInput
        name: "Brightness"
        StepSize: 20            # ‰ a detent: 50 detents from dark to full
      5:
        type: KeyInput
        name: "Shaft key"
  "6061626364656667":
    alias: kitchen-strip
    name: "The light over the counter"
    room: kitchen
    endpoints:
      # Eight WS2812 as one colour light (types/0x0020-output.md, LEVEL | COLOR_RGB) —
      # `lagun-sim rgb8`, the board devices/apps/rgb8 (zadania/zrobione/DEVICE-03.md).
      # kitchen-dial dims it (bindings.yaml); the colour is SetColor's, from the view (`c`).
      4:
        type: Output
        name: "Counter light"
        Purpose: LIGHT
        DefaultFadeTime: 400
